# netlify.toml — Deployment configuration for Netlify

[build]
  publish = "."        # Root folder is the published site
  command = ""         # No build step needed (pure static site)

# SPA redirect — all routes go back to index.html
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML or data files (so updates go live immediately)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-cache"
