# netlify.toml — Deployment configuration for Netlify

[build]
  publish = "."        # Root folder is the published site
  command = ""         # No build step needed (pure static site)

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# CSS y JS: siempre revalidar, porque sus nombres no cambian entre versiones
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imágenes y PDFs: caché de una semana
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/material/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Don't cache HTML or data files (so updates go live immediately)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-cache"
